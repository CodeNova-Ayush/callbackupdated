services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: callback
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: callback
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U callback -d callback']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://callback:${POSTGRES_PASSWORD}@postgres:5432/callback
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
    ports:
      # Localhost only. Caddy or nginx on the host is the public entry point.
      - '127.0.0.1:3000:3000'
    env_file:
      - path: .env
        required: false

volumes:
  pgdata:
